<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum</title>
    <link rel="stylesheet" href="style.css">
</head>

<h1>Casablanca</h1>
    
<body>
    <form action="NewAccount.html" method="get">
        <fieldset>
            <legend>Register an Account</legend>

            <label for="name">Username:</label><br>
            <input id="name" name="name" required><br><br>

            <label for="email">Enter your email:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="reEmail">Re-enter your email:</label><br>
            <input type="email" id="reEmail" name="reEmail" required><br><br>

            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required><br><br>

            <label for="rePassword">Re-enter your password:</label><br>
            <input type="password" id="rePassword" name="rePassword" required><br><br>

           <button type="submit">Next page</button>
        </fieldset>
    </form>
</body>

        <footer>
            <p>Very Cool Footer</p>
        </footer>

</body>

</html>
